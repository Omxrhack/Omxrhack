<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Un gran poder conlleva una gran responsabilidad</title>
<desc id="desc">Pie de página animado con temática de Spider-Man: telarañas en las esquinas, una araña colgando y el skyline nocturno.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06060B"/><stop offset="1" stop-color="#0F1019"/></linearGradient>
  <linearGradient id="suit" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B3121F"/><stop offset=".5" stop-color="#7E1430"/><stop offset="1" stop-color="#14307F"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".35" r=".55"><stop offset="0" stop-color="#E23636" stop-opacity="0.2"/><stop offset="1" stop-color="#E23636" stop-opacity="0"/></radialGradient>
</defs>
<style>
.strand{stroke-dasharray:1 1;animation:draw 2.6s cubic-bezier(.4,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fade{animation:fade 1.1s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tw1{opacity:.25;animation:tw 4.5s ease-in-out infinite}
.tw2{opacity:.55;animation:tw 7s ease-in-out infinite}
.tw3{opacity:.8;animation:tw 11s steps(2,jump-none) infinite}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:.95}}
.drop{animation:drop 6.5s ease-in-out infinite}
@keyframes drop{0%,100%{transform:translateY(0)}50%{transform:translateY(34px)}}
.sense{transform-box:fill-box;transform-origin:center;animation:sense 3.2s ease-out infinite}
@keyframes sense{0%{transform:scale(.35);opacity:.85}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
